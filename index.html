<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Focus Guardian</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    :root {
      --bg: #070b19;
      --card: #111827;
      --panel: #1e293b;
      --ok: #22c55e;
      --warn: #f43f5e;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 65%);
      color: var(--text);
      transition: background 0.25s ease;
    }
    body.alert-mode {
      background: radial-gradient(circle at top, #4c0519 0%, #16040a 65%);
    }
    .app {
      width: 100%;
      max-width: 780px;
      background: var(--card);
      border: 2px solid #334155;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      transition: border-color 0.2s ease;
    }
    body.alert-mode .app { border-color: var(--warn); }
    h1 { margin: 0 0 6px; font-size: 1.7rem; }
    .sub { margin: 0 0 20px; color: var(--muted); font-size: 0.95rem; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }
    .stat-card {
      background: var(--panel);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }
    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; font-weight: 700; }
    .stat-value { font-size: 1.5rem; font-weight: 800; margin-top: 4px; }

    .grid { display: grid; grid-template-columns: 280px 1fr; gap: 24px; align-items: start; }
    @media (max-width: 680px) {
      .grid { grid-template-columns: 1fr; }
      #webcam-container { margin: 0 auto; }
    }
    #webcam-container {
      width: 280px;
      height: 280px;
      border-radius: 16px;
      overflow: hidden;
      background: #020617;
      border: 2px solid #334155;
      display: grid;
      place-items: center;
      color: var(--muted);
    }

    .status-banner {
      padding: 16px;
      border-radius: 14px;
      font-size: 1.25rem;
      font-weight: 800;
      text-align: center;
      background: var(--panel);
      margin-bottom: 16px;
    }
    .status-banner.focused { background: rgba(34, 197, 94, 0.16); color: var(--ok); }
    .status-banner.distracted { background: rgba(244, 63, 94, 0.22); color: #fda4af; }

    .controls { display: flex; gap: 10px; margin-top: 12px; }
    button {
      flex: 1;
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    #start-btn { background: var(--accent); color: #082f49; }
    #sound-btn { background: var(--panel); color: var(--text); border: 1px solid #475569; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .bar-row { margin-bottom: 14px; }
    .bar-label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; font-weight: 600; }
    .bar-track { height: 11px; background: #020617; border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.08s linear; }
    .bar-fill.phone-bar { background: var(--warn); }
    .bar-fill.me-bar { background: var(--ok); }
  </style>
</head>
<body>
  <main class="app">
    <h1>AI Focus Guardian</h1>
    <p class="sub">Detects <code>me</code> vs <code>me_phone</code> live in your browser using TensorFlow.js.</p>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Status</div>
        <div id="state-text" class="stat-value">Idle</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Focus Time</div>
        <div id="focus-timer" class="stat-value">00:00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Phone Pickups</div>
        <div id="pickup-count" class="stat-value">0</div>
      </div>
    </div>

    <div class="grid">
      <div>
        <div id="webcam-container">Camera off</div>
        <div class="controls">
          <button id="start-btn">Start Monitor</button>
          <button id="sound-btn">Sound: ON</button>
        </div>
      </div>

      <div>
        <div id="banner" class="status-banner">Click "Start Monitor" to begin</div>
        <div id="bars"></div>
      </div>
    </div>
  </main>

  <script>
    // Change to your Teachable Machine URL if you used "Upload my model" instead of Download
    const MODEL_URL = "./my_model/";

    let model, webcam, audioCtx;
    let isRunning = false;
    let soundEnabled = true;
    let isDistracted = false;
    let phoneStartTime = null;
    let countedEpisode = false;
    let lastBeepTime = 0;
    let focusSeconds = 0;
    let phonePickups = 0;

    const startBtn = document.getElementById("start-btn");
    const soundBtn = document.getElementById("sound-btn");
    const banner = document.getElementById("banner");
    const stateText = document.getElementById("state-text");
    const focusTimerEl = document.getElementById("focus-timer");
    const pickupCountEl = document.getElementById("pickup-count");
    const barsEl = document.getElementById("bars");

    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "Sound: ON" : "Sound: OFF";
    });

    startBtn.addEventListener("click", init);

    function playBeep() {
      if (!soundEnabled || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    async function init() {
      startBtn.disabled = true;
      startBtn.textContent = "Loading AI...";
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      try {
        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
        webcam = new tmImage.Webcam(280, 280, true);
        await webcam.setup();
        await webcam.play();

        const camBox = document.getElementById("webcam-container");
        camBox.innerHTML = "";
        camBox.appendChild(webcam.canvas);

        barsEl.innerHTML = "";
        model.getClassLabels().forEach((label, i) => {
          const isPhone = label.toLowerCase().includes("phone");
          barsEl.innerHTML += `
            <div class="bar-row">
              <div class="bar-label"><span>${label}</span><span id="pct-${i}">0%</span></div>
              <div class="bar-track">
                <div class="bar-fill ${isPhone ? "phone-bar" : "me-bar"}" id="bar-${i}"></div>
              </div>
            </div>`;
        });

        isRunning = true;
        startBtn.textContent = "Monitoring Active";
        setInterval(() => {
          if (isRunning && !isDistracted) {
            focusSeconds++;
            focusTimerEl.textContent = formatTime(focusSeconds);
          }
        }, 1000);

        window.requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        banner.textContent = "Error loading camera or model — check localhost & my_model/";
        startBtn.disabled = false;
        startBtn.textContent = "Retry";
      }
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const predictions = await model.predict(webcam.canvas);
      let top = predictions[0];

      predictions.forEach((p, i) => {
        const pct = Math.round(p.probability * 100);
        document.getElementById(`pct-${i}`).textContent = pct + "%";
        document.getElementById(`bar-${i}`).style.width = pct + "%";
        if (p.probability > top.probability) top = p;
      });

      const isPhoneDetected = top.className.toLowerCase().includes("phone") && top.probability >= 0.75;
      const now = Date.now();

      if (isPhoneDetected) {
        if (!phoneStartTime) phoneStartTime = now;

        // Trigger alert only if phone is visible for 1+ second (prevents flicker false alarms)
        if (now - phoneStartTime >= 1000) {
          isDistracted = true;
          document.body.classList.add("alert-mode");
          banner.className = "status-banner distracted";
          banner.textContent = "Put the phone down!";
          stateText.textContent = "Distracted";

          if (!countedEpisode) {
            phonePickups++;
            pickupCountEl.textContent = phonePickups;
            countedEpisode = true;
          }
          if (now - lastBeepTime > 2500) {
            playBeep();
            lastBeepTime = now;
          }
        }
      } else {
        phoneStartTime = null;
        countedEpisode = false;
        isDistracted = false;
        document.body.classList.remove("alert-mode");
        banner.className = "status-banner focused";
        banner.textContent = "Focused — Great job!";
        stateText.textContent = "Focused";
      }
    }
  </script>
</body>
</html>
